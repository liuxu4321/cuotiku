name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Build release assets
        shell: bash
        run: |
          pnpm build
          pnpm exec electron-builder --publish never --config.publish.channel="${UPDATE_CHANNEL}"
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          INSTALLERS=(release/*.exe)
          BLOCKMAPS=(release/*.exe.blockmap)
          if [[ "${#INSTALLERS[@]}" -ne 1 ]]; then
            echo "Expected exactly one Windows installer, found ${#INSTALLERS[@]}." >&2
            exit 1
          fi
          if [[ "${#BLOCKMAPS[@]}" -ne 1 ]]; then
            echo "Expected exactly one blockmap, found ${#BLOCKMAPS[@]}." >&2
            exit 1
          fi
          test -f "release/${UPDATE_CHANNEL}.yml"
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}

      - name: Publish GitHub release
        shell: bash
        run: |
          shopt -s nullglob
          RELEASE_FILES=(release/*.exe release/*.exe.blockmap "release/${UPDATE_CHANNEL}.yml")
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            CREATE_ARGS=(release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "拾星错题本 ${GITHUB_REF_NAME}")
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              CREATE_ARGS+=(--prerelease)
            fi
            gh "${CREATE_ARGS[@]}"
          fi
          gh release upload "${GITHUB_REF_NAME}" "${RELEASE_FILES[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}

      - name: Setup coscmd
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install coscmd

      - name: Publish to Tencent COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: generic-1257458058
          COS_REGION: ap-guangzhou
          COS_PREFIX: yycuotiku
          COS_BASE_URL: https://generic-1257458058.cos.ap-guangzhou.myqcloud.com/yycuotiku
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" \
            --retry 5 --timeout 300 -p 8 -m 5
          shopt -s nullglob
          INSTALLERS=(release/*.exe)
          BLOCKMAPS=(release/*.exe.blockmap)
          if [[ "${#INSTALLERS[@]}" -ne 1 || "${#BLOCKMAPS[@]}" -ne 1 ]]; then
            echo "Expected exactly one installer and one blockmap." >&2
            exit 1
          fi
          upload_with_retry() {
            local src="$1" dst="$2"; shift 2
            local attempt
            for attempt in 1 2 3; do
              if coscmd upload -f "$@" "$src" "$dst"; then return 0; fi
              echo "Upload attempt ${attempt} failed for ${dst}, retrying in 10s…" >&2
              sleep 10
            done
            echo "Upload failed after 3 attempts: ${dst}" >&2
            return 1
          }
          # 安装包与差量文件（文件名带版本，可长期缓存）
          upload_with_retry "${INSTALLERS[0]}" "${COS_PREFIX}/$(basename "${INSTALLERS[0]}")"
          upload_with_retry "${BLOCKMAPS[0]}" "${COS_PREFIX}/$(basename "${BLOCKMAPS[0]}")"
          # 更新清单：禁止缓存，保证客户端及时看到新版本
          upload_with_retry "release/${UPDATE_CHANNEL}.yml" "${COS_PREFIX}/${UPDATE_CHANNEL}.yml" \
            -H '{"Cache-Control":"no-cache"}'
          # 上传后校验：COS 上清单版本必须与本次发版一致
          EXPECT_VERSION="$(node -p "require('./package.json').version")"
          for _ in 1 2 3 4 5 6; do
            LIVE="$(curl -fsS "${COS_BASE_URL}/${UPDATE_CHANNEL}.yml" 2>/dev/null | grep -m1 '^version:' | awk '{print $2}' || true)"
            if [[ "$LIVE" == "$EXPECT_VERSION" ]]; then
              echo "COS manifest verified: version ${LIVE}"
              exit 0
            fi
            echo "Waiting for COS manifest (got '${LIVE}', want '${EXPECT_VERSION}')…" >&2
            sleep 10
          done
          echo "COS manifest verification failed after upload." >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: yycuotiku-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
          if-no-files-found: error
