appId: com.yycuotiku.app
productName: 拾星错题本
artifactName: yycuotiku-${version}-${os}-${arch}.${ext}
asar: true
generateUpdatesFilesForAllChannels: true
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: yycuotiku.config.json
    to: yycuotiku.config.json
extraMetadata:
  main: out/main/index.js
publish:
  provider: generic
  url: https://generic-1257458058.cos.ap-guangzhou.myqcloud.com/yycuotiku
  channel: latest
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: 用于连接高拍仪或摄像头采集错题图片。
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  sign: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  executableName: yycuotiku
